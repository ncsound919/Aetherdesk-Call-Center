model_list:
  - model_name: deepseek-main
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: ollama-local
    litellm_params:
      model: ollama/qwen3:1.7b
      api_base: http://localhost:11434

litellm_settings:
  drop_params: true
  num_retries: 2
